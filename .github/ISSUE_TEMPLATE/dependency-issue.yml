name: "📦 Discord Bot Dependency Issue"
description: Report a problem with Discord bot dependencies
title: "📦 Dependency: "
labels: ["dependencies", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a dependency issue! Please fill out this form as completely as possible to help us resolve the issue quickly.
        
  - type: dropdown
    id: dependency-type
    attributes:
      label: Type of Dependency
      description: Select the category that best describes the dependency
      options:
        - Discord.js Core
        - Discord.js Extensions (Voice, Gateway, etc.)
        - Database Dependencies
        - API Integration Dependencies
        - Development Tools
        - pnpm/npm Package Manager Issue
        - Peer Dependencies
        - Optional Dependencies
        - Other
    validations:
      required: true
      
  - type: input
    id: package-name
    attributes:
      label: Package Name
      description: Which package is causing issues? Include scope if applicable
      placeholder: "discord.js, @discordjs/voice, @discordjs/rest, etc."
    validations:
      required: true
      
  - type: input
    id: current-version
    attributes:
      label: Current Version
      description: What version of the package are you currently using?
      placeholder: "14.14.1"
    validations:
      required: true

  - type: input
    id: expected-version
    attributes:
      label: Expected Working Version
      description: If known, what version should work or worked previously?
      placeholder: "14.14.0"
      
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: Please provide a clear and detailed description of the issue you're experiencing
      placeholder: |
        1. What's happening?
        2. What did you expect to happen?
        3. How is this affecting your bot's functionality?
        4. Steps to reproduce the issue
        5. Any specific Discord.js features affected
    validations:
      required: true
      
  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs
      description: Please copy and paste any relevant error messages or stack traces
      render: shell
      placeholder: |
        Error: Cannot find module 'package-name'
        at Object.<anonymous> (/path/to/file:1:1)
        ...
      
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Please provide details about your environment
      value: |
        - Operating System:
        - Node.js Version:
        - Package Manager & Version:
        - Discord.js Version:
        - Bot Version:
        - Intents Used:
        - Partials Used:
      render: markdown
      
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../CODE_OF_CONDUCT.md)
      options:
        - label: I have checked for existing issues and confirmed this is not a duplicate
          required: true
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I have checked the Discord.js documentation for similar issues
          required: true 