name: Pull Request Workflow
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  check-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check Required Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request data is missing');
              return;
            }

            const labels = pr.labels?.map(label => label.name) || [];
            const requiredLabels = ['enhancement', 'bug', 'documentation', 'dependencies'];
            const hasRequiredLabel = labels.some(label => requiredLabels.includes(label));
            
            if (!hasRequiredLabel) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: '⚠️ Please add at least one of the following labels: enhancement, bug, documentation, or dependencies'
                });
                console.log('Added label reminder comment');
              } catch (error) {
                if (error.status === 403) {
                  core.setFailed(`Permission denied. Please check if the workflow has the required permissions. Error details: ${error.message}`);
                } else {
                  core.setFailed(`Failed to add label reminder comment: ${error.message}`);
                }
              }
            } 
