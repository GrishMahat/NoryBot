version: '3.8'

services:
  bot:
    build: .
    container_name: norybot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: norybot-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
